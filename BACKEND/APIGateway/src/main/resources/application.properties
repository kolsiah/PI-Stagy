spring.application.name=APIGateway
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
server.port=8092
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
logging.level.org.springframework.cloud.gateway=TRACE
#logging.level.reactor.netty.http.client=DEBUG



# Configuration du routage avec Spring Cloud Gateway
#spring.cloud.gateway.routes[0].id=mysql-service
#spring.cloud.gateway.routes[0].uri=lb://MYSQL-SERVICE
#spring.cloud.gateway.routes[0].predicates[0]=Path=/api/**

# Enregistrement auprès d'Eureka
#eureka.instance.prefer-ip-address=true
# Eureka Client Configuration
eureka.instance.prefer-ip-address=true


# Spring Cloud Gateway Configuration
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# CORS Configuration
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

# Increase timeouts significantly
spring.cloud.gateway.httpclient.connect-timeout=30000
spring.cloud.gateway.httpclient.response-timeout=30000

# Circuit Breaker Configuration
spring.cloud.gateway.filter.circuit-breaker.enabled=true

# Retry Configuration
spring.cloud.gateway.filter.retry.enabled=true

# Detailed logging
#logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.web.reactive=DEBUG
logging.level.reactor.netty=DEBUG