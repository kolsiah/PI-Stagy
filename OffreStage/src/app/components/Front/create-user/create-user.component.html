<div class="container" style="padding-top: 300px; padding-bottom: 200px;">
  <div class="col-md-6 col-sm-8 col-md-offset-3 col-sm-offset-2">
    <form [formGroup]="createUserForm" (ngSubmit)="onSubmit()">
      <h2 class="text-center">Create an Account</h2>

      <div class="form-group">
        <input type="text" formControlName="nom" class="form-control input-lg" placeholder="Nom">
      </div>

      <div class="form-group">
        <input type="text" formControlName="prenom" class="form-control input-lg" placeholder="Prenom">
      </div>

      <div class="form-group">
        <input type="email" formControlName="email" class="form-control input-lg" placeholder="Email">
      </div>

      <div class="form-group">
        <input type="password" formControlName="password" class="form-control input-lg" placeholder="Password">
      </div>

      <div class="form-group">
        <select formControlName="role" class="form-control input-lg">
          <option value="">Select Role</option>
          <option value="ROLE_ETUDIANT">Etudiant</option>
          <option value="ROLE_ENTREPRISE">Entreprise</option>
          <option value="ROLE_ENSEIGNANT">Enseignant</option>
          <option value="ROLE_ADMIN">Admin</option>
        </select>
      </div>

      <!-- reCAPTCHA-like checkbox -->
      <div class="form-group" style="
        border: 1px solid #d3d3d3;
        padding: 15px;
        border-radius: 4px;
        background: #f9f9f9;
        width: 300px;
        margin-bottom: 20px;
        font-family: Arial, sans-serif;
      ">
        <label style="display: flex; align-items: center;">
          <input type="checkbox" formControlName="notRobot" style="margin-right: 10px; width: 18px; height: 18px;" />
          <span style="font-size: 14px; margin-right: auto;">I'm not a robot</span>
          <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" style="width: 28px; height: 28px; margin-left: 10px;" alt="reCAPTCHA logo" />
        </label>
        <div style="font-size: 10px; color: #777; margin-top: 8px; text-align: right;">
          reCAPTCHA <span style="text-decoration: underline; cursor: pointer;">Privacy - Terms</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" [disabled]="!createUserForm.get('notRobot')?.value">
        Register
      </button>

      <p *ngIf="errorMessage" class="text-danger">{{ errorMessage }}</p>
    </form>
  </div>
</div>
