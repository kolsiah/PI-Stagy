<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liste des Interview</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #f9fbfd, #f0f4f8);
      font-family: 'Segoe UI', sans-serif;
    }
    .table {
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .btn-custom-primary {
      background-color: #00b4d8;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 6px 16px;
    }
    .btn-custom-primary:hover {
      background-color: #0096c7;
    }
    .btn-custom-warning {
      background-color: #ffca3a;
      color: #212529;
      border: none;
      border-radius: 50px;
      padding: 6px 16px;
    }
    .btn-custom-warning:hover {
      background-color: #f4a261;
      color: white;
    }
    .btn-custom-danger {
      background-color: #f94144;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 6px 16px;
    }
    .btn-custom-danger:hover {
      background-color: #d62828;
    }
    h2 {
      color: #023e8a;
      font-weight: bold;
    }
    .alert {
      border-radius: 1rem;
    }
  </style>
</head>
<body>
  <div class="container mt-5 pt-5">
    <h2 class="text-center mb-4">Liste des Test</h2>   <button class="btn btn-custom-primary btn-sm" (click)="goToCalendar()">
        <i class="bi bi-check-circle"></i> show Calendrier
      </button>
    <div class="table-responsive">
      <table class="table table-bordered text-center">
        <thead class="table-light">
          <tr>
            <th>Candidat</th>
            <th>Commentaire</th>
            <th>Status</th>
            <th>Lien</th>
            <th>Note</th>
            <th>Mode</th>
            <th>Date</th>
        
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let interview of interviews">
            <td>{{ interview.candidature?.user?.nom }}</td>
            <td>{{ interview.commentaire }}</td>
            <td>{{ interview.status }}</td>
            <td>{{ interview.lienVisio }}</td>
            <td>{{ interview.note }}</td>
            <td>{{ interview.mode }}</td>
            <td>{{ interview.dateEntretien  | date  }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
<app-start-process></app-start-process>
